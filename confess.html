<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Untukmu 💌</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

</head>


<body>

    <div class="background">

        <div class="confess-card">

            <div class="envelope">
                💌
            </div>
            <img
    id="fotoConfess"
    class="foto-confess"
    alt="Foto confess"
>

            <p class="small-text">
                Ada pesan khusus untukmu...
            </p>
            <div class="music-player">

    <div class="music-icon">
        🎵
    </div>

    <div class="music-info">

        <strong id="namaLagu">
            Lagu untukmu
        </strong>

        <span>
            Dengarkan sambil membaca 💕
        </span>

    </div>

    <button
        id="tombolMusik"
        onclick="putarMusik()"
    >
        ▶️
    </button>

</div>

<audio id="audioLagu"></audio>

            <h1 id="judul">
                Untukmu ❤️
            </h1>

            <div class="surat">

                <p id="pesan">
                    Memuat pesan...
                </p>

            </div>

            <p class="dari">

                Dengan perasaan yang tulus,

                <br>

                <strong id="pengirim">
                    ...
                </strong>

            </p>


            <p class="pertanyaan">

                Apakah kamu merasakan hal yang sama? ❤️

            </p>


            <div class="buttons">

                <button
                    class="yes-button"
                    onclick="jawabYa()">

                    ❤️ Aku juga

                </button>


                <button
                    class="no-button"
                    onclick="jawabTidak()">

                    😢 Maaf

                </button>

            </div>

        </div>

    </div>
    <button class="share-button" onclick="bagikanConfess()">
    🔗 Bagikan Confess
</button>




    <!-- HASIL JAWABAN -->

    <div
        id="hasil"
        class="hasil-overlay">

        <div class="hasil-card">

            <div
                id="hasilIcon"
                class="hasil-icon">

                💌

            </div>


            <h2 id="hasilJudul">
                ...
            </h2>


            <p id="hasilPesan">
                ...
            </p>


            <div class="hasil-buttons">

                <button onclick="tutupHasil()">

                    💌 Tutup

                </button>


                <button onclick="confessBaru()">

                    💕 Buat Confess Baru

                </button>

            </div>

        </div>

    </div>



   <script>

// =========================
// MENGAMBIL ID CONFESS DARI URL
// =========================

const urlParams = new URLSearchParams(window.location.search);
const confessId = urlParams.get("id");


// =========================
// MENGAMBIL DATA DARI SUPABASE
// =========================

async function ambilConfess() {

    if (!confessId) {

        tampilkanTidakAdaConfess();

        return;
    }


    const { data, error } = await supabaseClient
        .from("confessions")
        .select("*")
        .eq("id", confessId)
        .single();


    if (error) {

        console.error("Error mengambil confess:", error);

        tampilkanTidakAdaConfess();

        return;
    }


    tampilkanConfess(data);
}


// =========================
// MENAMPILKAN CONFESS
// =========================

function tampilkanConfess(data) {

    // NAMA PENERIMA
    document.getElementById("judul").innerText =
        "Untuk " + data.penerima + " ❤️";


    // PESAN
    document.getElementById("pesan").innerText =
        data.pesan;


    // PENGIRIM
    document.getElementById("pengirim").innerText =
        data.pengirim;


    // =========================
    // TEMA
    // =========================

    if (data.tema) {

        document.body.classList.add(
            "tema-" + data.tema
        );

    }


    // =========================
    // FOTO
    // =========================

    if (data.foto) {

        const fotoElement =
            document.getElementById("fotoConfess");


        fotoElement.src =
            data.foto;


        fotoElement.style.display =
            "block";

    }


    // =========================
    // LAGU
    // =========================

    if (data.lagu) {

        const audio =
            document.getElementById("audioLagu");


        audio.src =
            data.lagu;


        if (data.nama_lagu) {

            document.getElementById("namaLagu").innerText =
                data.nama_lagu;

        }

    }

}


// =========================
// CONFESS TIDAK DITEMUKAN
// =========================

function tampilkanTidakAdaConfess() {

    document.getElementById("judul").innerText =
        "Confess tidak ditemukan 💌";


    document.getElementById("pesan").innerText =
        "Maaf, confess ini tidak tersedia atau link-nya tidak valid.";


    document.getElementById("pengirim").innerText =
        "-";

}


// =========================
// PLAY / PAUSE LAGU
// =========================

function putarMusik() {

    const audio =
        document.getElementById("audioLagu");


    const tombol =
        document.getElementById("tombolMusik");


    if (!audio.src) {

        alert("Belum ada lagu untuk diputar 🎵");

        return;
    }


    if (audio.paused) {

        audio.play();

        tombol.innerText =
            "⏸️";

    } else {

        audio.pause();

        tombol.innerText =
            "▶️";

    }

}


// =========================
// JAWAB "AKU JUGA"
// =========================

function jawabYa() {

    document.getElementById("hasil").className =
        "hasil-overlay berhasil";


    document.getElementById("hasilIcon").innerText =
        "💖";


    document.getElementById("hasilJudul").innerText =
        "Yay! ❤️";


    document.getElementById("hasilPesan").innerText =
        "Ternyata perasaan kalian sama!";


    buatHati();

}


// =========================
// JAWAB "MAAF"
// =========================

function jawabTidak() {

    document.getElementById("hasil").className =
        "hasil-overlay lembut";


    document.getElementById("hasilIcon").innerText =
        "🤍";


    document.getElementById("hasilJudul").innerText =
        "Tidak apa-apa 🤍";


    document.getElementById("hasilPesan").innerText =
        "Terima kasih sudah membaca dan menghargai perasaanku.";

}


// =========================
// TUTUP HASIL
// =========================

function tutupHasil() {

    document.getElementById("hasil").className =
        "hasil-overlay";

}


// =========================
// BUAT CONFESS BARU
// =========================

function confessBaru() {

    localStorage.removeItem("pengirim");

    localStorage.removeItem("penerima");

    localStorage.removeItem("pesan");

    localStorage.removeItem("foto");

    localStorage.removeItem("lagu");

    localStorage.removeItem("namaLagu");

    localStorage.removeItem("tema");

    localStorage.removeItem("confessId");


    window.location.href =
        "create.html";

}


// =========================
// ANIMASI HATI
// =========================

function buatHati() {

    for (let i = 0; i < 25; i++) {

        const hati =
            document.createElement("div");


        hati.className =
            "hati-terbang";


        hati.innerText =
            "❤️";


        hati.style.left =
            Math.random() * 100 + "%";


        hati.style.animationDelay =
            Math.random() * 2 + "s";


        hati.style.fontSize =
            (15 + Math.random() * 25) + "px";


        document.body.appendChild(hati);


        setTimeout(function () {

            hati.remove();

        }, 4000);

    }

}


// =========================
// BAGIKAN CONFESS
// =========================

function bagikanConfess() {

    const link =
        window.location.href;


    document.getElementById("hasilIcon").innerText =
        "🔗";


    document.getElementById("hasilJudul").innerText =
        "Bagikan Confess 💌";


    document.getElementById("hasilPesan").innerHTML =
        "Salin link di bawah ini:<br><br>" +
        "<input id='linkConfess' value='" +
        link +
        "' readonly style='width:100%; box-sizing:border-box;'>";


    document.getElementById("hasil").className =
        "hasil-overlay berhasil";

}


// =========================
// JALANKAN SAAT HALAMAN DIBUKA
// =========================

ambilConfess();

</script>
</body>
</html>
