<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Confess 💌</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <script src="supabase.js"></script>

</head>


<body>

<div class="background">

    <div class="card" id="confessCard">

        <div class="heart">
            💌
        </div>

        <h1>
            Membuka Confess...
        </h1>

        <p>
            Tunggu sebentar ya 💕
        </p>

    </div>

</div>



<script>


// =====================================
// AMBIL ID DARI URL
// =====================================

const params =
    new URLSearchParams(
        window.location.search
    );


const confessId =
    params.get("id");



// =====================================
// AMBIL DATA CONFESS
// =====================================

async function ambilConfess() {

    if (!confessId) {

        document
            .getElementById("confessCard")
            .innerHTML = `

                <div class="heart">
                    💔
                </div>

                <h1>
                    Confess tidak ditemukan
                </h1>

                <p>
                    Link confess tidak valid.
                </p>

            `;

        return;
    }



    const {
        data,
        error
    } =
        await supabaseClient
            .from("confessions")
            .select("*")
            .eq("id", confessId)
            .single();



    if (error || !data) {

        console.error(error);


        document
            .getElementById("confessCard")
            .innerHTML = `

                <div class="heart">
                    💔
                </div>

                <h1>
                    Confess tidak ditemukan
                </h1>

                <p>
                    Mungkin link sudah tidak valid.
                </p>

            `;

        return;
    }



    tampilkanConfess(data);

}



// =====================================
// TAMPILKAN CONFESS
// =====================================

function tampilkanConfess(data) {

    document.body.className =
        data.tema || "pink";


    let fotoHTML = "";


    if (data.foto) {

        fotoHTML = `

            <img
                src="${data.foto}"
                class="foto-confess"
                alt="Foto confess"
            >

        `;

    }



    let laguHTML = "";


    if (data.lagu) {

        laguHTML = `

            <div style="margin-top:20px;">

                <p>
                    🎵 ${data.nama_lagu || "Lagu"}
                </p>

                <audio
                    controls
                    autoplay
                    loop
                    style="width:100%;"
                >

                    <source
                        src="${data.lagu}"
                    >

                </audio>

            </div>

        `;

    }



    document
        .getElementById("confessCard")
        .innerHTML = `

            <div class="heart">
                💖
            </div>


            <h1>
                Untuk ${data.penerima} 💕
            </h1>


            ${fotoHTML}


            <p
                style="
                    white-space:pre-wrap;
                    margin-top:20px;
                "
            >
                ${escapeHTML(data.pesan)}
            </p>


            ${laguHTML}


            <p
                style="
                    margin-top:25px;
                    font-size:14px;
                "
            >
                Dari:
                <strong>
                    ${escapeHTML(data.pengirim)}
                </strong>
            </p>


            <hr>


            <h2>
                Maukah kamu menerima perasaanku? 💗
            </h2>


            <div
                id="tombolJawaban"
                style="
                    display:flex;
                    gap:10px;
                    justify-content:center;
                    flex-wrap:wrap;
                "
            >

                <button onclick="jawabYa()">
                    Iya ❤️
                </button>

                <button onclick="jawabTidak()">
                    Tidak 💔
                </button>

            </div>


            <div
                id="hasilJawaban"
                style="
                    display:none;
                    margin-top:20px;
                "
            ></div>


            <button
                onclick="bagikanConfess()"
                style="margin-top:20px;"
            >
                Bagikan Confess 💌
            </button>

        `;

}



// =====================================
// AMANKAN TEKS
// =====================================

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text || "";

    return div.innerHTML;

}



// =====================================
// KIRIM JAWABAN
// =====================================

async function kirimJawaban(jawaban) {

    const {
        data,
        error
    } =
        await supabaseClient
            .rpc(
                "submit_confession_response",
                {
                    p_confess_id:
                        confessId,

                    p_jawaban:
                        jawaban
                }
            );


    if (error) {

        console.error(error);

        alert(
            "Gagal mengirim jawaban.\n\n" +
            error.message
        );

        return;

    }



    if (!data) {

        alert(
            "Jawaban untuk confess ini sudah pernah dikirim 💌"
        );

        return;

    }



    document
        .getElementById("tombolJawaban")
        .style.display =
        "none";


    const hasil =
        document.getElementById(
            "hasilJawaban"
        );


    hasil.style.display =
        "block";


    if (jawaban === "ya") {

        hasil.innerHTML = `

            <h2>
                💖 Yeay!
            </h2>

            <p>
                Jawabanmu sudah dikirim.
            </p>

            <div style="font-size:40px;">
                💕💗💖💞
            </div>

        `;

    } else {

        hasil.innerHTML = `

            <h2>
                💌 Jawaban sudah dikirim
            </h2>

            <p>
                Terima kasih sudah menjawab
                dengan jujur.
            </p>

            <div style="font-size:40px;">
                💔🌸
            </div>

        `;

    }

}



// =====================================
// JAWAB IYA
// =====================================

function jawabYa() {

    kirimJawaban("ya");

}



// =====================================
// JAWAB TIDAK
// =====================================

function jawabTidak() {

    kirimJawaban("tidak");

}



// =====================================
// BAGIKAN
// =====================================

async function bagikanConfess() {

    const link =
        window.location.href;


    try {

        await navigator.clipboard.writeText(
            link
        );


        alert(
            "Link confess berhasil disalin 💕"
        );


    } catch (error) {

        prompt(
            "Salin link ini:",
            link
        );

    }

}



// =====================================
// MULAI
// =====================================

ambilConfess();

</script>

</body>

</html>
