<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Buat Confess 💌</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

</head>


<body>

    <div class="background">

        <div class="card">

            <div class="heart">💖</div>

            <h1>Buat Confess</h1>

            <p>
                Isi pesan yang ingin kamu sampaikan
                kepada seseorang yang spesial.
            </p>


            <!-- NAMA PENGIRIM -->

            <input
                type="text"
                id="pengirim"
                placeholder="Nama kamu"
            >


            <!-- NAMA PENERIMA -->

            <input
                type="text"
                id="penerima"
                placeholder="Nama orang yang dituju"
            >


            <!-- PESAN -->

            <textarea
                id="pesan"
                placeholder="Tulis pesan confess kamu..."
            ></textarea>


            <!-- FOTO -->

            <div class="pilihan">

                <label>
                    🖼️ Tambahkan Foto
                </label>

                <input
                    type="file"
                    id="foto"
                    accept="image/*"
                >

            </div>
            <!-- LAGU -->

<div class="pilihan">

    <label>
        🎵 Tambahkan Lagu
    </label>

    <input
        type="file"
        id="lagu"
        accept="audio/*"
    >

</div>


            <!-- PREVIEW FOTO -->

            <img
                id="previewFoto"
                class="preview-foto"
                alt="Preview foto"
            >


            <!-- TEMA -->

            <div class="pilihan">

                <label>
                    🎨 Pilih Tema
                </label>


                <select id="tema">

                    <option value="pink">
                        🌸 Sweet Pink
                    </option>

                    <option value="red">
                        🌹 Romantic Red
                    </option>

                    <option value="purple">
                        💜 Purple Dream
                    </option>

                    <option value="dark">
                        🌙 Midnight Love
                    </option>

                </select>

            </div>


            <!-- TOMBOL -->

            <button onclick="lihatConfess()">

                Lihat Confess 💕

            </button>

        </div>

    </div>



    <script>

        // =========================
        // PREVIEW FOTO
        // =========================

        document
            .getElementById("foto")
            .addEventListener("change", function () {

                const file = this.files[0];

                if (!file) {
                    return;
                }


                const reader = new FileReader();


                reader.onload = function (event) {

                    const preview =
                        document.getElementById("previewFoto");

                    preview.src =
                        event.target.result;

                    preview.style.display =
                        "block";


                    // Simpan foto

                    localStorage.setItem(
                        "foto",
                        event.target.result
                    );

                };


                reader.readAsDataURL(file);

            });

            // =========================
// LAGU
// =========================

document
    .getElementById("lagu")
    .addEventListener("change", function () {

        const file = this.files[0];

        if (!file) {
            return;
        }

        const reader = new FileReader();

        reader.onload = function (event) {

            localStorage.setItem(
                "lagu",
                event.target.result
            );

            localStorage.setItem(
                "namaLagu",
                file.name
            );

        };

        reader.readAsDataURL(file);

    });


        // =========================
        // LIHAT CONFESS
        // =========================

        async function lihatConfess() {

    const pengirim =
        document.getElementById("pengirim").value.trim();

    const penerima =
        document.getElementById("penerima").value.trim();

    const pesan =
        document.getElementById("pesan").value.trim();

    const tema =
        document.getElementById("tema").value;

    const fotoFile =
        document.getElementById("foto").files[0];

    const laguFile =
        document.getElementById("lagu").files[0];


    // =========================
    // CEK DATA
    // =========================

    if (
        pengirim === "" ||
        penerima === "" ||
        pesan === ""
    ) {

        alert(
            "Silakan isi semua data terlebih dahulu ❤️"
        );

        return;
    }


    // =========================
    // TAMPILKAN PROSES
    // =========================

    const tombol =
        document.querySelector("button");

    tombol.disabled = true;

    tombol.innerText =
        "Menyimpan Confess... 💌";


    try {

        let fotoURL = null;
        let laguURL = null;
        let namaLagu = null;


        // =========================
        // UPLOAD FOTO
        // =========================

        if (fotoFile) {

            const namaFoto =
                "foto-" +
                crypto.randomUUID() +
                "-" +
                fotoFile.name;

            const { error: fotoError } =
                await supabaseClient
                    .storage
                    .from("confess-media")
                    .upload(
                        namaFoto,
                        fotoFile,
                        {
                            cacheControl: "3600",
                            upsert: false
                        }
                    );

            if (fotoError) {
                throw fotoError;
            }


            const fotoResult =
                supabaseClient
                    .storage
                    .from("confess-media")
                    .getPublicUrl(namaFoto);

            fotoURL =
                fotoResult.data.publicUrl;
        }


        // =========================
        // UPLOAD LAGU
        // =========================

        if (laguFile) {

            namaLagu =
                laguFile.name;

            const namaFile =
                "lagu-" +
                crypto.randomUUID() +
                "-" +
                laguFile.name;

            const { error: laguError } =
                await supabaseClient
                    .storage
                    .from("confess-media")
                    .upload(
                        namaFile,
                        laguFile,
                        {
                            cacheControl: "3600",
                            upsert: false
                        }
                    );

            if (laguError) {
                throw laguError;
            }


            const laguResult =
                supabaseClient
                    .storage
                    .from("confess-media")
                    .getPublicUrl(namaFile);

            laguURL =
                laguResult.data.publicUrl;
        }


        // =========================
        // SIMPAN CONFESS
        // =========================

        const { data, error } =
            await supabaseClient
                .from("confessions")
                .insert({

                    pengirim: pengirim,

                    penerima: penerima,

                    pesan: pesan,

                    tema: tema,

                    foto: fotoURL,

                    lagu: laguURL,

                    nama_lagu: namaLagu

                })
                .select()
                .single();


        if (error) {
            throw error;
        }


        // =========================
        // SIMPAN ID
        // =========================

        localStorage.setItem(
            "confessId",
            data.id
        );


        // =========================
        // PINDAH KE CONFESS
        // =========================

        window.location.href =
            "confess.html?id=" +
            data.id;


    } catch (error) {

        console.error(error);

        alert(
            "Gagal menyimpan confess.\n\n" +
            error.message
        );

        tombol.disabled = false;

        tombol.innerText =
            "Lihat Confess 💕";
    }
}
</script>

</body>
</html>
